server:
  port: 8080

spring:
  application:
    name: smart-cattle-backend
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  datasource:
    url: jdbc:h2:mem:smart_cattle;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info

hardware:
  serial:
    # WiFi is the primary transport for the current hotspot deployment.
    # Set ESP32_SERIAL_ENABLED=true explicitly when using USB fallback.
    enabled: ${ESP32_SERIAL_ENABLED:false}
    port: ${ESP32_SERIAL_PORT:COM18}
    # Current physical wiring: COM5 environment, COM9 wearable.
    # Set ESP32_SERIAL_PORTS to a single value for legacy one-board operation.
    ports: ${ESP32_SERIAL_PORTS:COM5,COM9}
    env-port: ${ESP32_ENV_SERIAL_PORT:COM5}
    cow-port: ${ESP32_COW_SERIAL_PORT:COM9}
    env-system-path: ${ESP32_ENV_SERIAL_SYSTEM_PATH:}
    cow-system-path: ${ESP32_COW_SERIAL_SYSTEM_PATH:}
    baud-rate: ${ESP32_SERIAL_BAUD:115200}
    reconnect-ms: ${ESP32_SERIAL_RECONNECT_MS:3000}
    history-limit: ${ESP32_SERIAL_HISTORY_LIMIT:120}
    max-line-bytes: ${ESP32_SERIAL_MAX_LINE_BYTES:32768}

health:
  screening:
    current-window-minutes: 30
    baseline-retention-days: 7
    observation-cleanup-ms: ${HEALTH_OBSERVATION_CLEANUP_MS:3600000}
    minimum-baseline-minutes: 60
    minimum-current-window-minutes: 10
    vision-evidence-max-minutes: 30
    clinical-evidence-max-hours: 24
  models:
    # Comma-separated model versions approved after clinical release review.
    # Leave blank to keep disease candidates disabled even if edge firmware
    # reports modelStatus=deployed.
    audio:
      approved-versions: ${AUDIO_APPROVED_MODEL_VERSIONS:}
    lameness:
      approved-versions: ${LAMENESS_APPROVED_MODEL_VERSIONS:}
    vision:
      # Disease-like visual events remain archive-only until a clinically
      # reviewed vision release is explicitly approved on the server.
      approved-versions: ${VISION_APPROVED_MODEL_VERSIONS:}

security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  # Local commissioning stays open. Production must set both values through
  # deployment secrets and serve the API over TLS/reverse-proxy authentication.
  # Keys are role-scoped. API_KEY remains a backwards-compatible admin key;
  # prefer the five role-specific variables in production.
  api-key:
    enabled: ${API_KEY_ENABLED:false}
    require-role-keys: ${API_KEY_REQUIRE_ROLE_KEYS:false}
    value: ${API_KEY:}
    viewer: ${API_KEY_VIEWER:}
    ingest: ${API_KEY_INGEST:}
    operator: ${API_KEY_OPERATOR:}
    clinical: ${API_KEY_CLINICAL:}
    admin: ${API_KEY_ADMIN:}

app:
  assistant:
    # Full OpenAI-compatible chat/completions URL. Empty keeps the local knowledge mode.
    endpoint: ${CATTLE_ASSISTANT_ENDPOINT:}
    api-key: ${CATTLE_ASSISTANT_API_KEY:}
    model: ${CATTLE_ASSISTANT_MODEL:}
  seed-demo-data: ${DEMO_SEED_DATA:false}
  audio:
    storage-dir: ${AUDIO_STORAGE_DIR:../audio-clips}
    max-clip-bytes: ${AUDIO_MAX_CLIP_BYTES:20000}
    research:
      enabled: ${AUDIO_RESEARCH_ENABLED:true}
      python: ${AUDIO_RESEARCH_PYTHON:python}
      script: ${AUDIO_RESEARCH_SCRIPT:../scripts/audio_expand_retrain_20261026.py}
      model: ${AUDIO_RESEARCH_MODEL:../audio-training-data/artifacts/calf-cough-expanded-20261026/model.json}
      timeout-seconds: ${AUDIO_RESEARCH_TIMEOUT_SECONDS:30}
  vision:
    storage-dir: ${VISION_STORAGE_DIR:../vision-snapshots}
    max-snapshot-bytes: ${VISION_MAX_SNAPSHOT_BYTES:2000000}
  motion-capture:
    storage-dir: ${MOTION_CAPTURE_STORAGE_DIR:../motion-captures}
    expiry-grace-ms: ${MOTION_CAPTURE_EXPIRY_GRACE_MS:30000}
    expiry-sweep-ms: ${MOTION_CAPTURE_EXPIRY_SWEEP_MS:10000}
